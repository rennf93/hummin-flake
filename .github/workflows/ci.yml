# x86_64-linux only — the flake declares no other systems.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays: catch serpantinum/hummin upstream drift early

jobs:
  build:
    # The gate: both eval hosts. eval-test proves the patch graft composes on a serpantinum
    # host; eval-test-generic proves the no-serpantinum path (tray/dropdown/wake word) does too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix build .#packages.x86_64-linux.{hummin,hummin-menubar,hummin-assistant}
      - run: nix build .#nixosConfigurations.eval-test.config.system.build.toplevel
      - run: nix build .#nixosConfigurations.eval-test-generic.config.system.build.toplevel

  patch-drift:
    # Fails the weekly run the day a serpantinum commit breaks the patch chain,
    # long before it hits someone's flake update.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: apply chain against pinned serpantinum
        run: |
          PIN=$(nix eval --raw --impure --expr \
            '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.serpantinum.locked.rev')
          git clone --quiet --filter=blob:none https://github.com/ilyamiro/serpantinum.git /tmp/serp
          git -C /tmp/serp checkout --quiet "$PIN"
          git -C /tmp/serp apply patches/serpantinum-hummin-button.patch
          git -C /tmp/serp apply patches/serpantinum-hummin-assistant.patch
          git -C /tmp/serp apply patches/serpantinum-hummin-fleet.patch
      - name: apply chain against upstream master (advisory)
        run: |
          git clone --quiet https://github.com/ilyamiro/serpantinum.git /tmp/serp2
          git -C /tmp/serp2 checkout --quiet master
          git -C /tmp/serp2 apply patches/serpantinum-hummin-button.patch &&
          git -C /tmp/serp2 apply patches/serpantinum-hummin-assistant.patch &&
          git -C /tmp/serp2 apply patches/serpantinum-hummin-fleet.patch &&
          echo "chain also still applies on master" ||
          echo "::warning::patch chain no longer applies to serpantinum master — rebase before next bump"

  daemon-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        # 3.12 has a CPython asyncio regression this suite trips (teardown waits hang);
        # 3.11/3.13/3.15 all pass. The Nix build runs on nixpkgs' 3.13, so 3.13 is the one that matters.
        python-version: ["3.11", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: unit tests (self-stubbed, no system deps)
        # -v names each test as it completes: if the suite ever hangs on a runner,
        # the log's last line is the culprit.
        run: cd hummin-assistant && python3 -u -m unittest discover -s tests -t . -v
